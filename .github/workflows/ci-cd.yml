name: "CI/CD: Continuous integration and continuous deployment"

"on":
  push:
    branches:
      - '**'
    tags:
      - "v*"
  pull_request:

permissions: {}

jobs:
  build-check-test-push:
    permissions:
      contents: read
      packages: read
    # ponytail: SHA of feature/megalinter head; repin to a release tag/SHA on main after merge
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-typescript.yml@152b6607e7e2a23d83db3f372f72075159eb2c32  # feature/megalinter
    secrets: inherit  # zizmor: ignore[secrets-inherit] shared workflow declares no secrets: block
    with:
      checkAndTestOutsideDocker: true
      performRelease: false
      checkAndTestInsideDocker: false
      lintBlocking: true
