name: "CI/CD: Continuous integration and continuous deployment"

"on":
  push:
    branches:
      - '**'
    tags:
      - "v*"
  pull_request:

permissions: {}

jobs:
  build-check-test-push:
    permissions:
      contents: read
      packages: read
    # ponytail: SHA of feature/megalinter-review-fixes head; repin to a release tag/SHA on main after merge
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-typescript.yml@9bec3015413def036af3f17e7f1ab358b853b174  # feature/megalinter-review-fixes
    secrets: inherit  # zizmor: ignore[secrets-inherit] shared workflow declares no secrets: block
    with:
      checkAndTestOutsideDocker: true
      performRelease: false
      checkAndTestInsideDocker: false
      lintBlocking: true
